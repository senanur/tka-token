<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token TKA</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="display">
<main class="screen">
  <header class="topbar">
    <span>Token TKA · SMK TI Airlangga</span>
    <span class="right">
      <span id="status" class="status warn">Menghubungkan…</span>
      <span id="clock" class="clock">--:--:--</span>
    </span>
  </header>

  <section class="slot smk" data-key="smk">
    <div class="slot-head">
      <span class="slot-name">SMK</span>
      <span class="slot-meta"></span>
      <span class="countdown"></span>
    </div>
    <div class="token empty">Belum ada token</div>
  </section>

  <section class="slot sma" data-key="sma">
    <div class="slot-head">
      <span class="slot-name">SMA</span>
      <span class="slot-meta"></span>
      <span class="countdown"></span>
    </div>
    <div class="token empty">Belum ada token</div>
  </section>
</main>
<script src="/config.js"></script>
<script src="/common.js"></script>
<script src="/display.js"></script>
</body>
</html>
